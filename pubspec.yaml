name: snow_growth
description: Snow Growth - Brand portal and utility tools for brokers, fintech and asset managers.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  intl: ^0.20.2
  app_links: ^6.4.1
  http: ^1.6.0
  image_picker: ^1.2.1
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.10.1
  appsflyer_sdk: ^6.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  webview_flutter_platform_interface: ^2.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/logo_mark.svg
    - assets/brand_mark.png
    - assets/app_icon.png
    - assets/splash_brand.png
    - assets/hero-illustration.webp
    - assets/case.webp
