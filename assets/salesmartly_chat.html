<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snow Growth Chat</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <script>
        // Configure and queue commands before loading the SDK. This avoids
        // depending on the WebView's script/network timing to create `ssq`.
        window.__ssc = window.__ssc || {};
        window.__ssc.setting = Object.assign(
            {},
            window.__ssc.setting || {},
            { hideIcon: true }
        );
        window.ssq = window.ssq || [];

        window.ssq.push('onReady', function () {
            window.ssq.push('chatOpen', function (result) {
                if (!result || result.status !== 'success') {
                    console.warn('[SaleSmartly] chatOpen status:', result && result.status);
                }
            });
        });

        // Record that the widget emitted a visitor-send event without logging
        // message text or other customer data.
        window.ssq.push('onSendMessage', function (message) {
            var fields = message && typeof message === 'object'
                ? Object.keys(message)
                : [];
            console.info('[SaleSmartly] visitor message event; fields:', fields.join(','));
        });

        var salesmartlyScript = document.createElement('script');
        salesmartlyScript.src =
            'https://plugin-code.salesmartly.com/js/project_834655_866471_1790143164.js';
        salesmartlyScript.async = true;
        salesmartlyScript.onerror = function () {
            console.error('[SaleSmartly] failed to load the chat SDK script.');
        };
        document.head.appendChild(salesmartlyScript);
    </script>
</body>
</html>
